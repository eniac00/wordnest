<script src="data/vocabulary.js"></script><script src="js/engine.js"></script><script src="js/app.js"></script><script>/* no offline mode: remove any cached copy from earlier versions */if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));if('caches' in window)caches.keys().then(k=>k.forEach(x=>caches.delete(x)))</script></body></html>
